<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0e355d" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbfd"/><stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1269b0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="540" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1439" height="539" rx="18" fill="none" stroke="#d9e2ea"/>

  <!-- Title -->
  <text x="54" y="52" font-size="30" font-weight="800" fill="#0e355d">How a field radio's GPS reaches the map</text>
  <text x="54" y="82" font-size="16.5" fill="#5d6b78">BK P25 radios &#8594; your own PC &#8594; ArcGIS Earth &#183; no cloud, no vendor server, no BK dongle &#183; the radio is only ever read</text>

  <!-- ============ Arrows (drawn first, behind cards) ============ -->
  <g stroke="#1269b0" stroke-width="3.5" marker-end="url(#arrow)">
    <line x1="276" y1="238" x2="330" y2="238"/>
    <line x1="556" y1="238" x2="610" y2="238"/>
    <line x1="836" y1="238" x2="890" y2="238"/>
    <line x1="1116" y1="238" x2="1170" y2="238"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#1269b0" text-anchor="middle">
    <text x="303" y="224">RF</text>
    <text x="583" y="224">receive</text>
    <text x="863" y="224">USB</text>
    <text x="1143" y="224">API</text>
  </g>

  <!-- ============ Stage cards ============ -->
  <!-- card geometry: w=226 h=250 at y=120; centers 163,443,723,1003,1283 -->
  <g>
    <rect x="50" y="120" width="226" height="250" rx="14" fill="#ffffff" stroke="#dce6ee" filter="url(#card)"/>
    <rect x="330" y="120" width="226" height="250" rx="14" fill="#ffffff" stroke="#dce6ee" filter="url(#card)"/>
    <rect x="610" y="120" width="226" height="250" rx="14" fill="#ffffff" stroke="#dce6ee" filter="url(#card)"/>
    <rect x="890" y="120" width="226" height="250" rx="14" fill="#ffffff" stroke="#dce6ee" filter="url(#card)"/>
    <rect x="1170" y="120" width="226" height="250" rx="14" fill="#ffffff" stroke="#dce6ee" filter="url(#card)"/>
  </g>

  <!-- step pills -->
  <g font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="80" cy="150" r="15" fill="#1269b0"/><text x="80" y="155">1</text>
    <circle cx="360" cy="150" r="15" fill="#1269b0"/><text x="360" y="155">2</text>
    <circle cx="640" cy="150" r="15" fill="#1269b0"/><text x="640" y="155">3</text>
    <circle cx="920" cy="150" r="15" fill="#1269b0"/><text x="920" y="155">4</text>
    <circle cx="1200" cy="150" r="15" fill="#1269b0"/><text x="1200" y="155">5</text>
  </g>

  <!-- ===== 1. FIELD RADIO (portable) center x=163, icon area y 150-250 ===== -->
  <g transform="translate(163,205)">
    <!-- GPS satellite + signal above -->
    <g stroke="#218739" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M-30,-66 a26,26 0 0 1 24,-14"/>
      <path d="M-24,-60 a18,18 0 0 1 16,-9"/>
    </g>
    <g fill="#218739"><circle cx="2" cy="-83" r="4.5"/></g>
    <!-- handset body -->
    <rect x="-28" y="-44" width="56" height="92" rx="11" fill="#0e355d"/>
    <!-- antenna -->
    <rect x="18" y="-70" width="7" height="30" rx="3.5" fill="#17212b"/>
    <!-- display -->
    <rect x="-20" y="-36" width="40" height="22" rx="3" fill="#8fd0ff"/>
    <!-- speaker grille -->
    <g fill="#9db4c9"><circle cx="-12" cy="2" r="2.3"/><circle cx="-2" cy="2" r="2.3"/><circle cx="8" cy="2" r="2.3"/><circle cx="-12" cy="12" r="2.3"/><circle cx="-2" cy="12" r="2.3"/><circle cx="8" cy="12" r="2.3"/></g>
    <!-- ptt knob -->
    <rect x="-33" y="-20" width="6" height="26" rx="3" fill="#17212b"/>
  </g>
  <text x="163" y="300" font-size="16.5" font-weight="800" fill="#0e355d" text-anchor="middle">FIELD RADIO</text>
  <text x="163" y="324" font-size="13" fill="#5d6b78" text-anchor="middle">BK portable</text>
  <text x="163" y="343" font-size="13" fill="#5d6b78" text-anchor="middle">P25 Tier 1 GPS on</text>

  <!-- ===== 2. OVER THE AIR center x=443 ===== -->
  <g transform="translate(443,205)">
    <!-- broadcast waves -->
    <g stroke="#1269b0" fill="none" stroke-linecap="round">
      <path d="M-6,0 a44,44 0 0 1 0,-0.1" />
      <path d="M8,-34 a44,44 0 0 1 0,68" stroke-width="3"/>
      <path d="M22,-50 a66,66 0 0 1 0,100" stroke-width="3" stroke-opacity="0.75"/>
      <path d="M-8,-34 a44,44 0 0 0 0,68" stroke-width="3"/>
      <path d="M-22,-50 a66,66 0 0 0 0,100" stroke-width="3" stroke-opacity="0.75"/>
    </g>
    <!-- center node -->
    <circle cx="0" cy="0" r="9" fill="#f4b400" stroke="#0e355d" stroke-width="2"/>
  </g>
  <text x="443" y="300" font-size="16.5" font-weight="800" fill="#0e355d" text-anchor="middle">OVER THE AIR</text>
  <text x="443" y="324" font-size="13" fill="#5d6b78" text-anchor="middle">P25 on your</text>
  <text x="443" y="343" font-size="13" fill="#5d6b78" text-anchor="middle">licensed channel</text>

  <!-- ===== 3. BASE RADIO (mobile M150) center x=723 ===== -->
  <g transform="translate(723,205)">
    <!-- GPS puck antenna -->
    <ellipse cx="34" cy="-54" rx="16" ry="6" fill="#17212b"/>
    <rect x="31" y="-54" width="6" height="18" fill="#17212b"/>
    <!-- mobile body -->
    <rect x="-56" y="-36" width="112" height="70" rx="9" fill="#0e355d"/>
    <!-- display -->
    <rect x="-30" y="-26" width="60" height="30" rx="4" fill="#8fd0ff"/>
    <text x="0" y="-5" font-size="12" font-weight="800" fill="#0e355d" text-anchor="middle">M150</text>
    <!-- knobs -->
    <circle cx="-44" cy="-20" r="7" fill="#17212b"/><circle cx="-44" cy="2" r="7" fill="#17212b"/>
    <circle cx="44" cy="-20" r="7" fill="#17212b"/><circle cx="44" cy="2" r="7" fill="#17212b"/>
    <!-- buttons -->
    <g fill="#9db4c9"><rect x="-30" y="12" width="16" height="7" rx="2"/><rect x="-6" y="12" width="16" height="7" rx="2"/><rect x="18" y="12" width="16" height="7" rx="2"/></g>
    <!-- mic cord + mic -->
    <path d="M-56,20 q-24,6 -28,28" fill="none" stroke="#17212b" stroke-width="2.4"/>
    <rect x="-96" y="44" width="20" height="30" rx="5" fill="#17212b"/>
  </g>
  <text x="723" y="300" font-size="16.5" font-weight="800" fill="#0e355d" text-anchor="middle">BASE RADIO</text>
  <text x="723" y="324" font-size="13" fill="#5d6b78" text-anchor="middle">M150 mobile, relays</text>
  <text x="723" y="343" font-size="13" fill="#5d6b78" text-anchor="middle">the received GPS</text>

  <!-- ===== 4. P25 GPS TRACKER (PC) center x=1003 ===== -->
  <g transform="translate(1003,200)">
    <!-- laptop screen -->
    <rect x="-56" y="-46" width="112" height="72" rx="7" fill="#0e355d"/>
    <rect x="-49" y="-39" width="98" height="58" rx="3" fill="#0b2033"/>
    <!-- code glyph -->
    <text x="0" y="-8" font-size="20" font-weight="800" fill="#8fd0ff" text-anchor="middle" font-family="Consolas, monospace">&lt;/&gt;</text>
    <!-- a captured fix line -->
    <rect x="-40" y="4" width="54" height="6" rx="3" fill="#2f7f52"/>
    <circle cx="26" cy="7" r="5.5" fill="#e8731c"/>
    <!-- base -->
    <path d="M-66,26 L66,26 L78,44 L-78,44 Z" fill="#17212b"/>
    <rect x="-16" y="30" width="32" height="5" rx="2.5" fill="#3b566e"/>
  </g>
  <text x="1003" y="300" font-size="16.5" font-weight="800" fill="#0e355d" text-anchor="middle">P25 GPS TRACKER</text>
  <text x="1003" y="324" font-size="13" fill="#5d6b78" text-anchor="middle">USB RNDIS &#183; TCP 65535</text>
  <text x="1003" y="343" font-size="13" fill="#5d6b78" text-anchor="middle">reads $GNGGA + $PP25</text>

  <!-- ===== 5. ARCGIS EARTH (globe + pin) center x=1283 ===== -->
  <g transform="translate(1283,205)">
    <circle cx="0" cy="0" r="54" fill="#143f63"/>
    <!-- land blobs -->
    <path d="M-34,-20 q18,-14 36,-4 q10,8 -4,18 q-20,8 -30,-2 q-8,-6 -2,-12 z" fill="#2f7f52"/>
    <path d="M6,14 q16,-6 26,6 q4,12 -12,16 q-18,2 -20,-10 q-2,-10 6,-12 z" fill="#2f7f52"/>
    <!-- grid -->
    <g stroke="#9ec4e6" stroke-width="1" fill="none" stroke-opacity="0.55">
      <ellipse cx="0" cy="0" rx="54" ry="20"/><ellipse cx="0" cy="0" rx="20" ry="54"/>
      <line x1="-54" y1="0" x2="54" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#0e355d" stroke-width="2"/>
    <!-- orange pin -->
    <path d="M18,-30 c0,-13 -20,-13 -20,0 c0,10 10,16 10,24 c0,-8 10,-14 10,-24 z" fill="#e8731c" stroke="#ffffff" stroke-width="2"/>
    <circle cx="8" cy="-30" r="4.5" fill="#ffffff"/>
    <!-- label tag -->
    <g transform="translate(24,-44)">
      <rect x="0" y="0" width="60" height="22" rx="5" fill="#0e355d"/>
      <text x="30" y="15.5" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Jax 24</text>
    </g>
  </g>
  <text x="1283" y="300" font-size="16.5" font-weight="800" fill="#0e355d" text-anchor="middle">ARCGIS EARTH</text>
  <text x="1283" y="324" font-size="13" fill="#5d6b78" text-anchor="middle">named dot on</text>
  <text x="1283" y="343" font-size="13" fill="#5d6b78" text-anchor="middle">your offline map</text>

  <!-- ============ Payload ribbon ============ -->
  <g>
    <rect x="50" y="398" width="1346" height="112" rx="12" fill="#0e355d"/>
    <text x="74" y="430" font-size="13.5" font-weight="800" fill="#f4b400" letter-spacing="0.06em">WHAT TRAVELS — two standard NMEA sentences per fix</text>
    <text x="74" y="464" font-size="16" fill="#eaf3fb" font-family="Consolas, monospace">$GNGGA,173713.00,3023.62611,N,08156.26128,W,1,12,0.81,19.6,M,...</text>
    <text x="74" y="492" font-size="16" fill="#eaf3fb" font-family="Consolas, monospace">$PP25,9076801,</text>
    <text x="712" y="492" font-size="14" fill="#9ec4e6">&#8594; the sending radio's P25 unit ID  (named 9076801 &#8594; "Jax 24")</text>
    <text x="712" y="464" font-size="14" fill="#9ec4e6">&#8594; position, fix quality, satellites, altitude</text>
  </g>
</svg>
